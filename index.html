<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050d18">
  <meta name="description" content="WaveChat — دردشة حقيقية بين الأصدقاء.">
  <title>WaveChat — دردشة حقيقية</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230b1a2f'/%3E%3Cpath d='M14 36c6-10 12-10 18 0s12 10 18 0' fill='none' stroke='%2338bdf8' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/real.css?v=4">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wavechat_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 14c2.5-4.5 5-4.5 7.5 0s5 4.5 7.5 0 3.5-3.5 5-2" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><path d="M2 8.5c2.5-4.5 5-4.5 7.5 0" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" opacity=".55"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a1.9 1.9 0 0 0 .38 2.1l.06.06a2.3 2.3 0 1 1-3.25 3.25l-.06-.06a1.9 1.9 0 0 0-2.1-.38 1.9 1.9 0 0 0-1.15 1.74V21a2.3 2.3 0 1 1-4.6 0v-.1a1.9 1.9 0 0 0-1.24-1.74 1.9 1.9 0 0 0-2.1.38l-.06.06a2.3 2.3 0 1 1-3.25-3.25l.06-.06a1.9 1.9 0 0 0 .38-2.1 1.9 1.9 0 0 0-1.74-1.15H3a2.3 2.3 0 1 1 0-4.6h.1a1.9 1.9 0 0 0 1.74-1.24 1.9 1.9 0 0 0-.38-2.1l-.06-.06a2.3 2.3 0 1 1 3.25-3.25l.06.06a1.9 1.9 0 0 0 2.1.38H10a1.9 1.9 0 0 0 1.15-1.74V3a2.3 2.3 0 1 1 4.6 0v.1a1.9 1.9 0 0 0 1.15 1.74 1.9 1.9 0 0 0 2.1-.38l.06-.06a2.3 2.3 0 1 1 3.25 3.25l-.06.06a1.9 1.9 0 0 0-.38 2.1V10a1.9 1.9 0 0 0 1.74 1.15H21a2.3 2.3 0 1 1 0 4.6h-.1a1.9 1.9 0 0 0-1.74 1.15Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M14 8l4 4-4 4M18 12H9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5.2M12 7.6v.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M4.3 12 20 4.5l-4 15.3-4.4-6.1L4.3 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m11.6 13.7 4.2-4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4.2 4.2L19 6.8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-checks" viewBox="0 0 24 24"><path d="m2.5 13 4 4L15 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m10.5 13 4 4L23 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-group" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M2.8 19.4c.7-3.2 3.1-4.8 6.2-4.8s5.5 1.6 6.2 4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16 5.8a3 3 0 0 1 0 5.7M18 14.9c1.9.5 3.1 2 3.5 4.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15 6.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.4 8.4 0 1 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l2.4-3.2A8.5 8.5 0 1 1 21 11.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 11.5h7M8.5 8h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".7"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- ===================== auth ===================== -->
    <main id="auth-screen" class="auth">
      <div class="auth-card">
        <div class="brand">
          <div class="logo"><svg aria-hidden="true"><use href="#i-wave"></use></svg></div>
          <h1>WaveChat</h1>
          <p>دردشة حقيقية مع أصدقائك، من أي مكان</p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="تسجيل الدخول أو إنشاء حساب">
          <button type="button" role="tab" data-auth-tab="login" class="active" aria-selected="true">دخول</button>
          <button type="button" role="tab" data-auth-tab="register" aria-selected="false">حساب جديد</button>
        </div>

        <form id="login-form" novalidate>
          <label class="field">
            <span>اسم المستخدم أو البريد الإلكتروني</span>
            <input id="login-id" name="identifier" autocomplete="username" placeholder="username أو name@example.com" dir="auto" spellcheck="false" required>
          </label>
          <label class="field">
            <span>كلمة المرور</span>
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" dir="ltr" required>
          </label>
          <p class="form-error" id="login-error" role="alert" hidden></p>
          <button class="btn primary block" type="submit" id="login-submit">دخول</button>
        </form>

        <form id="register-form" novalidate hidden>
          <label class="field">
            <span>الاسم الظاهر</span>
            <input id="reg-name" name="name" autocomplete="name" placeholder="مثال: أحمد" maxlength="40" dir="auto">
          </label>
          <label class="field">
            <span>اسم المستخدم</span>
            <input id="reg-username" name="username" autocomplete="username" placeholder="ahmed" maxlength="30" dir="ltr" spellcheck="false" required>
          </label>
          <label class="field">
            <span>البريد الإلكتروني</span>
            <input id="reg-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" dir="ltr" spellcheck="false" required>
          </label>
          <label class="field">
            <span>كلمة المرور</span>
            <input id="reg-password" name="password" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل" minlength="6" dir="ltr" required>
          </label>
          <p class="form-error" id="register-error" role="alert" hidden></p>
          <button class="btn primary block" type="submit" id="register-submit">إنشاء الحساب</button>
        </form>

        <p class="auth-note">الرسائل تُحفظ على الخادم وتصل فورًا. لا تُستخدم بياناتك لأي غرض آخر.</p>
        <a class="auth-apk" href="WaveChat.apk" download="WaveChat.apk">تحميل تطبيق أندرويد (APK)</a>
      </div>
    </main>

    <!-- ===================== chat app ===================== -->
    <section id="chat-app" class="app" hidden>
      <aside class="sidebar">
        <header class="side-head">
          <button class="me" type="button" data-action="settings" aria-label="الإعدادات">
            <span class="avatar" id="me-avatar"></span>
            <span class="me-text"><strong id="me-name"></strong><small id="me-handle"></small></span>
          </button>
          <div class="side-actions">
            <button class="icon-btn accent" type="button" data-action="new-chat" aria-label="محادثة جديدة" title="محادثة جديدة"><svg><use href="#i-plus"></use></svg></button>
            <button class="icon-btn" type="button" data-action="settings" aria-label="الإعدادات" title="الإعدادات"><svg><use href="#i-settings"></use></svg></button>
          </div>
        </header>

        <div class="search">
          <div class="wrap">
            <svg aria-hidden="true"><use href="#i-search"></use></svg>
            <input id="search" type="search" placeholder="بحث في المحادثات" autocomplete="off" aria-label="بحث في المحادثات">
          </div>
        </div>

        <div class="list" id="conv-list" role="listbox" aria-label="المحادثات"></div>

        <footer class="side-foot">
          <span class="conn" id="conn-status">متصل</span>
          <button class="link-btn" type="button" data-action="logout">تسجيل الخروج</button>
        </footer>
      </aside>

      <main class="chat">
        <div class="empty" id="empty-state">
          <div class="art"><svg aria-hidden="true"><use href="#i-chat"></use></svg></div>
          <h2>مرحبًا في WaveChat</h2>
          <p>اختر محادثة من القائمة أو ابدأ محادثة جديدة مع صديق.</p>
          <button class="btn primary" type="button" data-action="new-chat">محادثة جديدة</button>
        </div>

        <div class="chat-view" id="chat-view" hidden>
          <header class="chat-head">
            <button class="icon-btn back" type="button" data-action="back" aria-label="رجوع"><svg><use href="#i-back"></use></svg></button>
            <span class="avatar" id="chat-avatar"></span>
            <div class="chat-title">
              <strong id="chat-name"></strong>
              <small id="chat-sub"></small>
            </div>
            <button class="icon-btn" type="button" data-action="chat-info" aria-label="معلومات المحادثة" title="معلومات المحادثة"><svg><use href="#i-info"></use></svg></button>
          </header>

          <div class="messages" id="messages" aria-live="polite" aria-relevant="additions"></div>

          <div class="typing" id="typing" hidden>
            <span class="dots"><i></i><i></i><i></i></span>
            <span id="typing-text"></span>
          </div>

          <button class="scroll-down" id="scroll-down" type="button" hidden aria-label="النزول إلى أحدث الرسائل">
            <svg><use href="#i-down"></use></svg>
            <span class="n" id="scroll-count" hidden></span>
          </button>

          <form class="composer" id="composer">
            <button class="icon-btn" type="button" data-action="emoji" aria-label="إيموجي" title="إيموجي">😊</button>
            <textarea id="composer-input" rows="1" placeholder="اكتب رسالة…" aria-label="نص الرسالة" maxlength="4000" dir="auto"></textarea>
            <button class="btn primary send" type="submit" id="send-btn" aria-label="إرسال"><svg><use href="#i-send"></use></svg></button>
          </form>
        </div>
      </main>
    </section>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/real.js?v=5"></script>
</body>
</html>
